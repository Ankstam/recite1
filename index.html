<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>WordFlow 沉浸背词</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="bedtime">
  <div id="app" class="app-shell">
    <!-- 顶部栏（全屏时完全隐藏） -->
    <header class="topbar">
      <div class="row">
        <select id="bookSelect" aria-label="选择单词册"></select>
        <select id="categorySelect" aria-label="选择分类">
          <option value="ALL">全部分类</option>
        </select>
        <button id="openImportBtn" class="btn-ghost">+ 导入</button>
      </div>
      <div class="row mode-tabs">
        <button class="mode-btn active" data-mode="bedtime">睡前</button>
        <button class="mode-btn" data-mode="wakeup">醒来</button>
        <button class="mode-btn" data-mode="daily">日常</button>
        <button id="rotateBtn" class="btn-ghost">横/竖屏</button>
        <button id="fullscreenBtn" class="btn-accent">纯净全屏</button>
      </div>
    </header>

    <!-- 核心展示舞台（纯净全屏下仅保留此区域内容） -->
    <main id="stage" class="stage">
      <div class="card">
        <div id="cardCategory" class="card-category">分类</div>
        <h1 id="cardWord" class="card-word">Ready</h1>
        <div id="cardPhonetic" class="card-phonetic">/ˈred.i/</div>
        <div id="cardMeaning" class="card-meaning">点击播放开始背诵，或导入词库</div>
        <ul id="cardPhrases" class="card-phrases"></ul>
      </div>

      <!-- 全屏轻触后浮现的极简退出浮层，默认完全隐藏 -->
      <div id="fsHud" class="fs-hud">
        <button id="fsPlayToggle">暂停 / 继续</button>
        <button id="fsRotateToggle">横/竖屏</button>
        <button id="fsExitBtn">退出全屏</button>
      </div>
    </main>

    <!-- 底部控制面板（全屏时完全隐藏） -->
    <footer class="controls">
      <div class="progress-line">
        <span id="progressText">0 / 0</span>
        <label class="inline-check">
          <input type="checkbox" id="readPhrasesChk" checked /> 连读词组
        </label>
        <select id="sleepTimerSelect" aria-label="定时停止">
          <option value="0">不定时</option>
          <option value="10">10分钟后停</option>
          <option value="20">20分钟后停</option>
          <option value="30">30分钟后停</option>
        </select>
      </div>

      <div class="sliders">
        <label>
          <span>显示停留：<strong id="displaySpeedVal">4.0s</strong></span>
          <input type="range" id="displaySpeed" min="1.5" max="15" step="0.5" value="4.0" />
        </label>
        <label>
          <span>朗读语速：<strong id="speechRateVal">0.80x</strong></span>
          <input type="range" id="speechRate" min="0.5" max="1.6" step="0.05" value="0.80" />
        </label>
      </div>

      <div class="transport">
        <button id="prevBtn">上一个</button>
        <button id="speakOnceBtn">单次朗读</button>
        <button id="playPauseBtn" class="btn-primary">自动播放</button>
        <button id="nextBtn">下一个</button>
      </div>
    </footer>
  </div>

  <!-- 本地导入弹窗 -->
  <dialog id="importDialog" class="modal">
    <form method="dialog" class="modal-body">
      <h3>导入本地单词册</h3>
      <input type="text" id="importBookName" placeholder="词库名称（如：睡前高频词）" />
      <label class="file-box">
        选择本地 .json 或 .txt 文件
        <input type="file" id="importFileInput" accept=".json,.txt,.csv" />
      </label>
      <textarea id="importTextArea" rows="6" placeholder="也可直接粘贴 JSON，或每行一条文本格式：&#10;单词 | 音标 | 释义 | 词组1; 词组2 | 分类"></textarea>
      <div class="modal-actions">
        <button type="button" id="deleteLocalBookBtn" class="btn-danger">删除当前本地库</button>
        <button value="cancel" class="btn-ghost">取消</button>
        <button type="button" id="confirmImportBtn" class="btn-primary">保存并使用</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
